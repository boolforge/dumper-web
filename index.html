<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macintosh Dumper Web</title>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --terminal-bg: #1e1e1e;
            --terminal-text: #d4d4d4;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }
        h1 { margin-top: 0; font-size: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 1rem; }
        .step { margin-bottom: 2rem; }
        .step-title { font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
        .badge { background: var(--primary); color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.875rem; }
        
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            background: #f9fafb;
            transition: all 0.2s ease;
        }
        .upload-zone.active { border-color: var(--primary); background: #eff6ff; }
        .upload-zone input[type="file"] { display: none; }
        .upload-btn {
            background: var(--primary); color: white; padding: 0.5rem 1rem; border-radius: 6px; border: none; cursor: pointer; font-weight: 500;
        }
        .upload-btn:disabled { background: var(--text-muted); cursor: not-allowed; }
        
        .terminal {
            background: var(--terminal-bg);
            color: var(--terminal-text);
            font-family: 'Courier New', Courier, monospace;
            padding: 1rem;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            font-size: 0.875rem;
            line-height: 1.5;
        }
        .terminal .stdout { color: #d4d4d4; }
        .terminal .stderr { color: #ef4444; }
        .terminal .system { color: #10b981; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Macintosh Disk Image Extractor</h1>
    
    <div class="step">
        <div class="step-title"><span class="badge">1</span> Environment Initialization</div>
        <p style="font-size: 0.875rem; color: var(--text-muted);" id="status-text">Booting Python engine in your browser...</p>
    </div>

    <div class="step">
        <div class="step-title"><span class="badge">2</span> Select Disk Image</div>
        <div class="upload-zone" id="drop-zone">
            <p>Upload a Macintosh <b>.dsk</b> or <b>.img</b> file.</p>
            <input type="file" id="file-input" disabled />
            <button class="upload-btn" id="upload-trigger" disabled>Select File</button>
        </div>
    </div>

    <div class="step">
        <div class="step-title"><span class="badge">3</span> Processing Logs</div>
        <div class="terminal" id="terminal"></div>
    </div>
</div>

<script>
    let pyodide;
    const terminal = document.getElementById('terminal');
    const fileInput = document.getElementById('file-input');
    const uploadTrigger = document.getElementById('upload-trigger');
    const statusText = document.getElementById('status-text');

    function log(text, type = 'stdout') {
        const span = document.createElement('span');
        span.className = type;
        span.textContent = text + '\n';
        terminal.appendChild(span);
        terminal.scrollTop = terminal.scrollHeight;
    }

    async function initEnvironment() {
        try {
            log("Initializing Pyodide...", "system");
            pyodide = await loadPyodide({
                stdout: (text) => log(text, 'stdout'),
                stderr: (text) => log(text, 'stderr')
            });

            log("Installing dependencies (machfs, pycdlib)...", "system");
            await pyodide.loadPackage("micropip");
            const micropip = pyodide.pyimport("micropip");
            await micropip.install(['machfs', 'pycdlib']);

            log("Fetching dumper-companion.py...", "system");
            const response = await fetch("https://raw.githubusercontent.com/scummvm/scummvm/master/devtools/dumper-companion.py");
            const pythonCode = await response.text();
            pyodide.FS.writeFile('/dumper-companion.py', pythonCode);

            log("✅ Environment ready. Waiting for file...", "system");
            statusText.textContent = "Ready. Please upload a file below.";
            statusText.style.color = "#10b981";
            
            fileInput.disabled = false;
            uploadTrigger.disabled = false;
        } catch (error) {
            log(`Initialization failed: ${error}`, "stderr");
            statusText.textContent = "Failed to boot environment.";
            statusText.style.color = "#ef4444";
        }
    }

    uploadTrigger.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        log(`\n--- Starting extraction for: ${file.name} ---`, "system");
        
        try {
            // Write to Pyodide Virtual FS
            const arrayBuffer = await file.arrayBuffer();
            pyodide.FS.writeFile(file.name, new Uint8Array(arrayBuffer));
            
            // Load and execute wrapper
            const wrapperCode = await (await fetch('wrapper.py')).text();
            await pyodide.runPythonAsync(wrapperCode);
            
            // Run the wrapper abstraction
            const output = pyodide.runPython(`process_file('${file.name}')`);
            log(output, 'stdout');
            log("✅ Extraction process completed.", "system");
            
        } catch (err) {
            log(`Execution error: ${err}`, "stderr");
        }
    });

    // Boot
    initEnvironment();
</script>

</body>
</html>
