<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScummVM Dumper Companion - Web GUI</title>
    <!-- Tailwind para una GUI moderna al instante -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pyodide para el runtime de Python -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <!-- JSZip para empaquetar la salida -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-8 font-sans">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <header class="border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-green-400">Dumper Companion Web</h1>
            <p class="text-gray-400 text-sm mt-1">Ejecutando dumper-companion.py original vía WebAssembly</p>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Panel de Control -->
            <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
                <h2 class="text-xl font-semibold mb-4">1. Carga de Archivos</h2>
                <input type="file" id="fileInput" multiple class="block w-full text-sm text-gray-400
                    file:mr-4 file:py-2 file:px-4 file:rounded file:border-0
                    file:text-sm file:font-semibold file:bg-green-600 file:text-white
                    hover:file:bg-green-500 cursor-pointer mb-4" />
                
                <h2 class="text-xl font-semibold mb-4 mt-6">2. Argumentos CLI</h2>
                <p class="text-xs text-gray-400 mb-2">Los archivos subidos están en <code>/in/</code>. La salida debe ir a <code>/out/</code>.</p>
                <input type="text" id="argsInput" value="extract /in/ /out/" 
                    class="w-full bg-gray-900 border border-gray-600 rounded p-2 text-white font-mono text-sm mb-6 focus:outline-none focus:border-green-400">

                <button id="runBtn" disabled
                    class="w-full bg-green-600 hover:bg-green-500 disabled:bg-gray-600 disabled:cursor-not-allowed text-white font-bold py-3 px-4 rounded transition-colors">
                    Cargando Python Runtime...
                </button>
            </div>

            <!-- Consola de Salida -->
            <div class="bg-black p-4 rounded-lg shadow-lg flex flex-col h-96">
                <h2 class="text-gray-400 text-sm font-semibold mb-2 uppercase tracking-wider">Terminal Output</h2>
                <pre id="consoleOutput" class="flex-1 overflow-y-auto text-green-400 font-mono text-xs whitespace-pre-wrap">Iniciando entorno...</pre>
                <button id="downloadBtn" class="hidden mt-4 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded transition-colors">
                    Descargar ZIP Generado
                </button>
            </div>
        </main>
    </div>

    <script>
        let pyodide;
        const consoleEl = document.getElementById('consoleOutput');
        const runBtn = document.getElementById('runBtn');
        const fileInput = document.getElementById('fileInput');
        const argsInput = document.getElementById('argsInput');
        const downloadBtn = document.getElementById('downloadBtn');

        function log(msg) {
            consoleEl.textContent += `\n${msg}`;
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        async function init() {
            try {
                pyodide = await loadPyodide({
                    stdout: (text) => log(text),
                    stderr: (text) => log(`[ERROR] ${text}`)
                });
                
                log("Entorno Python cargado. Obteniendo dumper-companion.py del master...");
                
                // Fetch del script oficial en vivo
                const response = await fetch("https://raw.githubusercontent.com/scummvm/scummvm/master/devtools/dumper-companion.py");
                const pythonCode = await response.text();
                
                // Escribir el script en el sistema de archivos virtual
                pyodide.FS.writeFile('/dumper-companion.py', pythonCode);
                
                // Crear directorios de I/O
                pyodide.FS.mkdir('/in');
                pyodide.FS.mkdir('/out');
                
                log("Sistema listo. Esperando archivos.");
                runBtn.textContent = "Ejecutar Dumper";
                runBtn.disabled = false;

            } catch (error) {
                log(`[CRITICAL] Error de inicialización: ${error.message}`);
            }
        }

        runBtn.addEventListener('click', async () => {
            const files = fileInput.files;
            if (files.length === 0) {
                log("[WARNING] No has seleccionado ningún archivo original.");
                return;
            }

            runBtn.disabled = true;
            runBtn.textContent = "Procesando...";
            downloadBtn.classList.add('hidden');
            log("\n--- Nueva Ejecución ---");

            try {
                // Limpiar I/O previo
                cleanupFS('/in');
                cleanupFS('/out');

                // Montar archivos de entrada en MemFS
                for (let file of files) {
                    const arrayBuffer = await file.arrayBuffer();
                    pyodide.FS.writeFile(`/in/${file.name}`, new Uint8Array(arrayBuffer));
                    log(`Cargado en memoria: ${file.name}`);
                }

                // Preparar argumentos
                const args = argsInput.value.split(" ").filter(a => a.trim() !== "");
                
                // Script puente de ejecución para evadir SystemExit(0)
                const execWrapper = `
import sys
import runpy

sys.argv = ['dumper-companion.py'] + ${JSON.stringify(args)}
try:
    runpy.run_path('/dumper-companion.py', run_name='__main__')
except SystemExit as e:
    if str(e) != '0' and str(e) != 'None':
        print(f"Script finalizado con código: {e}")
                `;

                log(`Ejecutando: python dumper-companion.py ${args.join(" ")}`);
                await pyodide.runPythonAsync(execWrapper);

                log("Ejecución completada. Comprobando archivos generados...");
                await prepareDownload();

            } catch (error) {
                log(`[ERROR] ${error.message}`);
            } finally {
                runBtn.disabled = false;
                runBtn.textContent = "Ejecutar Dumper";
            }
        });

        function cleanupFS(path) {
            try {
                const nodes = pyodide.FS.readdir(path).filter(f => f !== '.' && f !== '..');
                for (let node of nodes) {
                    pyodide.FS.unlink(`${path}/${node}`);
                }
            } catch(e) {}
        }

        async function prepareDownload() {
            const outFiles = pyodide.FS.readdir('/out').filter(f => f !== '.' && f !== '..');
            if (outFiles.length === 0) {
                log("[INFO] No se generó ningún archivo en /out/.");
                return;
            }

            const zip = new JSZip();
            outFiles.forEach(file => {
                const fileData = pyodide.FS.readFile(`/out/${file}`);
                zip.file(file, fileData);
                log(`Empaquetando: ${file}`);
            });

            const content = await zip.generateAsync({ type: "blob" });
            const url = URL.createObjectURL(content);
            
            downloadBtn.onclick = () => {
                const a = document.createElement("a");
                a.href = url;
                a.download = "dumper_output.zip";
                a.click();
            };
            
            downloadBtn.classList.remove('hidden');
            log("¡Archivos listos para descargar!");
        }

        // Iniciar
        init();
    </script>
</body>
</html>
